project: "h3-protocol"
language: "yaml"

guards:
  secrets:
    enabled: true
    severity: block
  build:
    enabled: false
  lint:
    enabled: false
  tests:
    enabled: false
  dead_code:
    enabled: false

test:
  mode: full

commit:
  require_guard_pass: true

pipeline:
  stages:
    - id: tier1
      parallel: true
      on: [pre-commit, pre-eval]
      steps:
        - id: guard
          type: script
          run: "gitreins guard"
          on_fail: block

evaluator:
  max_iterations: 50
  max_time: "10m"
  max_input_tokens: "0.2M"
  max_output_tokens: "0.05M"
  max_tokens_per_call: 16384
  tool_call_weight: 0.1
  compaction_threshold: 0.90
  code_context_budget: 0.70

defaults:
  model: deepseek-v4-flash
  api_key_env: GITREINS_LLM_API_KEY
  max_iterations: 100
  check_for_updates: true
  update_check_ttl: "24h"
